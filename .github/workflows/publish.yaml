---
name: publish
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: renovate version. By default, the latest version is published.
        required: false
permissions: {}
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - id: version
        run: |
          set -euo pipefail
          latest=$(npm view renovate version)
          version=${VERSION:-$latest}
          if npm view "@suzuki-shunsuke/renovate-config-validator@$version" version 2>/dev/null | grep -q .; then
            echo "===> $version is already published" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Don't move the latest tag when an old version is published
          tag=latest
          if [ "$version" != "$latest" ]; then
            tag=old
          fi
          {
            echo "skip=false"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
      - if: steps.version.outputs.skip == 'false'
        run: npm install --save-exact --ignore-scripts --no-audit --no-fund "renovate@$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - if: steps.version.outputs.skip == 'false'
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - if: steps.version.outputs.skip == 'false'
        run: npm run build
      - if: steps.version.outputs.skip == 'false'
        run: npm test
      - if: steps.version.outputs.skip == 'false'
        run: npm publish --tag "$TAG"
        env:
          TAG: ${{ steps.version.outputs.tag }}
